<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Arc Drawing App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            overflow: hidden;
        }
        .controls {
            padding: 10px;
            overflow-y: auto;
            border-right: 1px solid #ccc;
        }
        .canvas-container {
            position: relative;
            overflow: hidden;
        }
        canvas {
            border: 1px solid black;
            display: block;
            width: 100%;
            height: 100%;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #ccc;
        }
        .tab {
            padding: 10px;
            cursor: pointer;
            background-color: #f0f0f0;
            border-right: 1px solid #ccc;
        }
        .tab.active {
            background-color: #fff;
            font-weight: bold;
        }
        .tab-content {
            display: none;
            padding: 10px;
        }
        .tab-content.active {
            display: block;
        }
        .current-segment {
            margin: 10px 0;
            font-size: 14px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 3px;
            text-align: center;
        }
        th:nth-child(1), td:nth-child(1) {
            width: 40px; /* # column */
        }
        th:nth-child(2), td:nth-child(2) {
            width: 120px; /* Length column */
        }
        th:nth-child(3), td:nth-child(3) {
            width: 120px; /* Angle column */
        }
        td input[type="number"] {
            width: 90px;
            padding: 2px;
        }
        .selected {
            background-color: #d3d3d3;
        }
        .scrollable-table {
            max-height: 300px;
            overflow-y: auto;
        }
        .control-buttons {
            margin: 10px 0;
        }
        .control-buttons button {
            margin: 0 5px;
            padding: 5px 10px;
        }
        .settings-option {
            margin: 10px 0;
        }
        /* Portrait layout */
        @media (max不为-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .controls {
                border-right: none;
                border-bottom: 1px solid #ccc;
            }
            .scrollable-table {
                max-height: 200px;
            }
            th:nth-child(1), td:nth-child(1) {
                width: 30px;
            }
            th:nth-child(2), td:nth-child(2) {
                width: 100px;
            }
            th:nth-child(3), td:nth-child(3) {
                width: 100px;
            }
            td input[type="number"] {
                width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="controls">
            <div class="tabs">
                <div class="tab active" onclick="showTab('draw')">Draw</div>
                <div class="tab" onclick="showTab('file')">File</div>
                <div class="tab" onclick="showTab('settings')">Settings</div>
            </div>
            <div id="draw" class="tab-content active">
                <div class="current-segment">
                    Current Segment: <span id="currentLength">0</span> pixels, <span id="currentAngle">0</span> degrees
                </div>
                <div class="control-buttons">
                    <button onclick="clearCanvas()">Clear</button>
                    <button onclick="insertArc()" id="insertBtn">Insert Arc</button>
                    <button onclick="deleteArc()" id="deleteBtn">Delete Arc</button>
                </div>
                <div class="scrollable-table">
                    <table id="segmentTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Length (pixels)</th>
                                <th>Angle (degrees)</th>
                            </tr>
                        </thead>
                        <tbody id="segmentTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div id="file" class="tab-content">
                <div class="control-buttons">
                    <button onclick="exportPath()">Export Path</button>
                    <label for="importFile">Import Path:</label>
                    <input type="file" id="importFile" accept=".txt" onchange="importPath(event)">
                </div>
            </div>
            <div id="settings" class="tab-content">
                <div class="settings-option">
                    <label>Layout Side:</label>
                    <select onchange="swapLayout(this.value)">
                        <option value="left">Controls on Left</option>
                        <option value="right">Controls on Right</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Turtle state
        let turtle = {
            x: 0,
            y: 0,
            heading: 0 // In radians, 0 points right (east)
        };

        // Path segments
        let segments = [];

        // Touch/mouse state
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let previewSegment = null;
        let previewEndX = 0;
        let previewEndY = 0;
        let editingIndex = -1; // Index of the segment being edited (-1 for adding new segment at end, -2 for start)
        let editingStartX = 0;
        let editingStartY = 0;
        let editingStartHeading = 0;
        let initialOffsetX = 0;
        let initialOffsetY = 0;

        // Convert degrees to radians
        function toRadians(degrees) {
            return degrees * Math.PI / 180;
        }

        // Convert radians to degrees
        function toDegrees(radians) {
            return radians * 180 / Math.PI;
        }

        // Normalize angle to [-360, 360] for touch input
        function normalizeAngleForTouch(angle) {
            return ((angle + 360) % 720) - 360;
        }

        // Resize canvas to fit container
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            turtle.x = canvas.width / 2;
            turtle.y = canvas.height / 2;
            redraw();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Draw a single arc segment
        function drawArcSegment(length, angle, isPreview = false, startX = turtle.x, startY = turtle.y, startHeading = turtle.heading) {
            // If length is 0, it's a sharp turn (just update heading)
            if (length === 0) {
                if (!isPreview) {
                    turtle.heading += toRadians(angle);
                }
                return { endX: startX, endY: startY, heading: startHeading + toRadians(angle) };
            }

            // If angle is 0, it's a straight line
            if (angle === 0) {
                const dx = length * Math.cos(startHeading);
                const dy = length * Math.sin(startHeading);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                const endX = startX + dx;
                const endY = startY + dy;
                if (!isPreview) {
                    turtle.x = endX;
                    turtle.y = endY;
                }
                ctx.lineTo(endX, endY);
                ctx.stroke();
                return { endX, endY, heading: startHeading };
            }

            // General case: arc approximated by short line segments
            const angleRad = toRadians(angle);
            const radius = Math.abs(length / angleRad); // Arc length = radius * angle
            const steps = Math.max(10, Math.floor(Math.abs(length) / 5)); // Adjust step count based on length
            const stepLength = length / steps;
            const stepAngle = angleRad / steps;

            ctx.beginPath();
            ctx.moveTo(startX, startY);

            let currentX = startX;
            let currentY = startY;
            let currentHeading = startHeading;

            for (let i = 0; i < steps; i++) {
                // Move forward by stepLength
                const dx = stepLength * Math.cos(currentHeading);
                const dy = stepLength * Math.sin(currentHeading);
                currentX += dx;
                currentY += dy;
                // Turn by stepAngle
                currentHeading += stepAngle;
                // Draw line to new position
                ctx.lineTo(currentX, currentY);
            }

            ctx.stroke();
            if (!isPreview) {
                turtle.x = currentX;
                turtle.y = currentY;
                turtle.heading = currentHeading;
            }
            return { endX: currentX, endY: currentY, heading: currentHeading };
        }

        // Calculate the position and heading up to a given segment index
        function calculatePositionUpTo(index) {
            let tempTurtle = { x: canvas.width / 2, y: canvas.height / 2, heading: 0 };
            for (let i = 0; i < index && i < segments.length; i++) {
                const { endX, endY, heading } = drawArcSegment(segments[i].length, segments[i].angle, true, tempTurtle.x, tempTurtle.y, tempTurtle.heading);
                tempTurtle.x = endX;
                tempTurtle.y = endY;
                tempTurtle.heading = heading;
            }
            return tempTurtle;
        }

        // Redraw all segments and show cursor
        function redraw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Reset turtle to initial state
            turtle.x = canvas.width / 2;
            turtle.y = canvas.height / 2;
            turtle.heading = 0;

            // Draw all segments
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            let tempTurtle = { x: turtle.x, y: turtle.y, heading: turtle.heading };
            for (let i = 0; i < segments.length; i++) {
                const { endX, endY, heading } = drawArcSegment(segments[i].length, segments[i].angle, false, tempTurtle.x, tempTurtle.y, tempTurtle.heading);
                tempTurtle.x = endX;
                tempTurtle.y = endY;
                tempTurtle.heading = heading;
            }

            // Update editing start position
            if (editingIndex >= 0 && editingIndex < segments.length) {
                const pos = calculatePositionUpTo(editingIndex);
                editingStartX = pos.x;
                editingStartY = pos.y;
                editingStartHeading = pos.heading;

                // Calculate the end position of the selected segment for the green dot
                const { endX, endY } = drawArcSegment(segments[editingIndex].length, segments[editingIndex].angle, true, editingStartX, editingStartY, editingStartHeading);
                if (!isDragging) {
                    previewEndX = endX;
                    previewEndY = endY;
                }
            } else if (editingIndex === -1) {
                const pos = calculatePositionUpTo(segments.length);
                editingStartX = pos.x;
                editingStartY = pos.y;
                editingStartHeading = pos.heading;
                previewEndX = editingStartX;
                previewEndY = editingStartY;
            } else if (editingIndex === -2) {
                editingStartX = canvas.width / 2;
                editingStartY = canvas.height / 2;
                editingStartHeading = 0;
                previewEndX = editingStartX;
                previewEndY = editingStartY;
            }

            // Draw cursor at the current start position
            ctx.beginPath();
            ctx.arc(editingStartX, editingStartY, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'red';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Draw endpoint cursor
            ctx.beginPath();
            ctx.arc(previewEndX, previewEndY, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'green';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Update current segment display
            if (previewSegment) {
                document.getElementById('currentLength').textContent = previewSegment.length.toFixed(2);
                document.getElementById('currentAngle').textContent = previewSegment.angle.toFixed(2);
            } else if (editingIndex >= 0 && editingIndex < segments.length) {
                document.getElementById('currentLength').textContent = segments[editingIndex].length.toFixed(2);
                document.getElementById('currentAngle').textContent = segments[editingIndex].angle.toFixed(2);
            } else {
                document.getElementById('currentLength').textContent = '0';
                document.getElementById('currentAngle').textContent = '0';
            }

            // Update the table
            updateSegmentTable();
        }

        // Update the segment table
        function updateSegmentTable() {
            const tbody = document.getElementById('segmentTableBody');
            tbody.innerHTML = '';

            // Add a row for the start of the path
            const startRow = document.createElement('tr');
            if (editingIndex === -2) startRow.classList.add('selected');
            startRow.innerHTML = `
                <td>Start</td>
                <td>-</td>
                <td>-</td>
            `;
            startRow.onclick = (e) => {
                if (e.target.tagName !== 'INPUT') {
                    editSegment(-2);
                }
            };
            tbody.appendChild(startRow);

            // Add rows for each segment
            segments.forEach((segment, index) => {
                const row = document.createElement('tr');
                if (index === editingIndex) {
                    row.classList.add('selected');
                }
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><input type="number" value="${segment.length.toFixed(2)}" onchange="updateSegment(${index}, 'length', this.value)"></td>
                    <td><input type="number" value="${segment.angle.toFixed(2)}" onchange="updateSegment(${index}, 'angle', this.value)"></td>
                `;
                row.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        editSegment(index);
                    }
                };
                tbody.appendChild(row);
            });

            // Add a row for the end of the path
            const endRow = document.createElement('tr');
            if (editingIndex === -1) endRow.classList.add('selected');
            endRow.innerHTML = `
                <td>End</td>
                <td>-</td>
                <td>-</td>
            `;
            endRow.onclick = (e) => {
                if (e.target.tagName !== 'INPUT') {
                    editSegment(-1);
                }
            };
            tbody.appendChild(endRow);

            // Enable/disable toolbar buttons
            document.getElementById('insertBtn').disabled = false;
            document.getElementById('deleteBtn').disabled = editingIndex < 0 || editingIndex >= segments.length;
        }

        // Update a segment's value
        function updateSegment(index, field, value) {
            segments[index][field] = parseFloat(value) || 0;
            redraw();
        }

        // Edit a segment using touch/mouse
        function editSegment(index) {
            editingIndex = index;
            redraw();
        }

        // Insert a new arc
        function insertArc() {
            if (editingIndex === -2) {
                segments.unshift({ length: 0, angle: 0 });
            } else if (editingIndex === -1 || editingIndex === segments.length) {
                segments.push({ length: 0, angle: 0 });
            } else {
                segments.splice(editingIndex + 1, 0, { length: 0, angle: 0 });
            }
            editingIndex = editingIndex === -2 ? 0 : editingIndex + 1;
            redraw();
        }

        // Delete the selected arc
        function deleteArc() {
            if (editingIndex < 0 || editingIndex >= segments.length) return;
            segments.splice(editingIndex, 1);
            if (editingIndex >= segments.length) {
                editingIndex = -1;
            }
            redraw();
        }

        // Clear the canvas and reset segments
        function clearCanvas() {
            segments = [];
            editingIndex = -1;
            redraw();
        }

        // Export path data as a text file
        function exportPath() {
            if (segments.length === 0) {
                alert("No segments to export!");
                return;
            }

            const data = segments.map(segment => `${segment.length},${segment.angle}`).join('\n') + '\n';
            const blob = new Blob([data], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'turtle_path.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Import path data from a text file
        function importPath(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                try {
                    const lines = text.trim().split('\n');
                    segments = [];
                    let lineNumber = 0;
                    for (const line of lines) {
                        lineNumber++;
                        const parts = line.split(',').map(num => num.trim());
                        if (parts.length !== 2) {
                            throw new Error(`Invalid number of values in line ${lineNumber}: ${line} (expected "length,angle")`);
                        }
                        const length = parseFloat(parts[0]);
                        const angle = parseFloat(parts[1]);
                        if (isNaN(length)) {
                            throw new Error(`Invalid length in line ${lineNumber}: ${parts[0]} is not a number`);
                        }
                        if (isNaN(angle)) {
                            throw new Error(`Invalid angle in line ${lineNumber}: ${parts[1]} is not a number`);
                        }
                        segments.push({ length, angle });
                    }
                    editingIndex = -1;
                    redraw();
                } catch (error) {
                    alert(`Error loading file: ${error.message}`);
                    segments = [];
                    editingIndex = -1;
                    redraw();
                }
            };
            reader.onerror = function() {
                alert("Error reading file!");
            };
            reader.readAsText(file);
        }

        // Touch/Mouse event handlers
        function getRelativePosition(event) {
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (event.type.startsWith('touch')) {
                const touch = event.touches[0] || event.changedTouches[0];
                x = touch.clientX - rect.left;
                y = touch.clientY - rect.top;
            } else {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            return { x, y };
        }

        function startDragging(event) {
            event.preventDefault();
            isDragging = true;
            const pos = getRelativePosition(event);
            dragStartX = pos.x;
            dragStartY = pos.y;

            // Initialize previewEndX and previewEndY to the current end position of the selected segment
            if (editingIndex >= 0 && editingIndex < segments.length) {
                const pos = calculatePositionUpTo(editingIndex);
                editingStartX = pos.x;
                editingStartY = pos.y;
                editingStartHeading = pos.heading;
                const { endX, endY } = drawArcSegment(segments[editingIndex].length, segments[editingIndex].angle, true, editingStartX, editingStartY, editingStartHeading);
                previewEndX = endX;
                previewEndY = endY;
                previewSegment = { length: segments[editingIndex].length, angle: segments[editingIndex].angle };
                // Calculate the initial offset between the red dot (start) and green dot (end)
                initialOffsetX = previewEndX - editingStartX;
                initialOffsetY = previewEndY - editingStartY;
            } else {
                previewSegment = { length: 0, angle: 0 };
                previewEndX = editingStartX;
                previewEndY = editingStartY;
                initialOffsetX = 0;
                initialOffsetY = 0;
            }
            redraw();
        }

        function updateDragging(event) {
            if (!isDragging) return;
            event.preventDefault();
            const pos = getRelativePosition(event);
            const dx = pos.x - dragStartX;
            const dy = pos.y - dragStartY;

            // Calculate the new position of the green dot, accounting for the initial offset
            previewEndX = editingStartX + initialOffsetX + dx;
            previewEndY = editingStartY + initialOffsetY + dy;

            // Calculate the secant length (distance from start to new end position)
            const secantDx = previewEndX - editingStartX;
            const secantDy = previewEndY - editingStartY;
            const secantLength = Math.sqrt(secantDx * secantDx + secantDy * secantDy);

            // Calculate the angle between the turtle's heading and the secant
            const secantAngle = Math.atan2(secantDy, secantDx);
            const angleRad = secantAngle - editingStartHeading;
            const angleDeg = toDegrees(angleRad);

            // The arc's change in heading is twice the angle between the heading and the secant
            let arcAngleDeg = 2 * angleDeg;

            // Normalize the angle to [-360, 360] for touch input
            arcAngleDeg = normalizeAngleForTouch(arcAngleDeg);

            // Calculate the arc length
            const absAngleRad = toRadians(Math.abs(arcAngleDeg));
            let arcLength = 0;
            if (absAngleRad > 0.0001) {
                const radius = secantLength / (2 * Math.sin(absAngleRad / 2));
                arcLength = radius * absAngleRad;
            } else {
                arcLength = secantLength;
            }

            previewSegment = { length: arcLength, angle: arcAngleDeg };

            // Update the selected segment in real-time
            if (editingIndex >= 0 && editingIndex < segments.length) {
                segments[editingIndex] = { length: arcLength, angle: arcAngleDeg };
            }

            redraw();
        }

        function stopDragging(event) {
            if (!isDragging) return;
            event.preventDefault();
            isDragging = false;
            if (previewSegment) {
                if (editingIndex >= 0) {
                    // Already updated in real-time
                } else if (editingIndex === -2) {
                    // Insert at the start
                    segments.unshift(previewSegment);
                    editingIndex = 0;
                } else {
                    // Add a new segment at the end
                    segments.push(previewSegment);
                    editingIndex = -1;
                }
                previewSegment = null;
            }
            initialOffsetX = 0;
            initialOffsetY = 0;
            redraw();
        }

        // Add event listeners for touch and mouse
        canvas.addEventListener('mousedown', startDragging);
        canvas.addEventListener('mousemove', updateDragging);
        canvas.addEventListener('mouseup', stopDragging);
        canvas.addEventListener('touchstart', startDragging);
        canvas.addEventListener('touchmove', updateDragging);
        canvas.addEventListener('touchend', stopDragging);

        // Tab navigation
        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelector(`.tab[onclick="showTab('${tabId}')"]`).classList.add('active');
        }

        // Swap layout sides
        function swapLayout(side) {
            const container = document.getElementById('container');
            if (side === 'right') {
                container.style.gridTemplateColumns = '1fr 300px';
                container.style.gridTemplateAreas = '"canvas controls"';
                container.children[0].style.order = 1;
                container.children[1].style.order = 0;
            } else {
                container.style.gridTemplateColumns = '300px 1fr';
                container.style.gridTemplateAreas = '"controls canvas"';
                container.children[0].style.order = 0;
                container.children[1].style.order = 1;
            }
        }

        // Initial draw
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        redraw();
    </script>
</body>
</html>
