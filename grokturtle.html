<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Arc Drawing App</title>
    <style>
        canvas {
            border: 1px solid black;
        }
        .controls {
            margin: 10px;
        }
        .controls input[type="number"] {
            width: 100px;
        }
        .controls button {
            margin: 0 5px;
        }
        table {
            border-collapse: collapse;
            margin: 10px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 5px;
            text-align: center;
        }
        td input[type="number"] {
            width: 80px;
        }
        .selected {
            background-color: #d3d3d3;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="length">Segment Length (pixels):</label>
        <input type="number" id="length" value="50" step="1" min="0">
        <label for="angle">Angle (degrees):</label>
        <input type="number" id="angle" value="30" step="1">
        <button onclick="addSegment()">Add Segment</button>
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="exportPath()">Export Path</button>
        <label for="importFile">Import Path:</label>
        <input type="file" id="importFile" accept=".txt" onchange="importPath(event)">
    </div>
    <table id="segmentTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Length (pixels)</th>
                <th>Angle (degrees)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="segmentTableBody"></tbody>
    </table>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Turtle state
        let turtle = {
            x: canvas.width / 2, // Start at canvas center
            y: canvas.height / 2,
            heading: 0 // In radians, 0 points right (east)
        };

        // Path segments
        let segments = [];

        // Touch/mouse state
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let previewSegment = null;
        let previewEndX = 0;
        let previewEndY = 0;
        let editingIndex = -1; // Index of the segment being edited (-1 for adding new segment)

        // Convert degrees to radians
        function toRadians(degrees) {
            return degrees * Math.PI / 180;
        }

        // Convert radians to degrees
        function toDegrees(radians) {
            return radians * 180 / Math.PI;
        }

        // Normalize angle to [-360, 360] for touch input
        function normalizeAngleForTouch(angle) {
            return ((angle + 360) % 720) - 360;
        }

        // Draw a single arc segment
        function drawArcSegment(length, angle, isPreview = false, startX = turtle.x, startY = turtle.y, startHeading = turtle.heading) {
            // If length is 0, it's a sharp turn (just update heading)
            if (length === 0) {
                if (!isPreview) {
                    turtle.heading += toRadians(angle);
                }
                return { endX: startX, endY: startY };
            }

            // If angle is 0, it's a straight line
            if (angle === 0) {
                const dx = length * Math.cos(startHeading);
                const dy = length * Math.sin(startHeading);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                const endX = startX + dx;
                const endY = startY + dy;
                if (!isPreview) {
                    turtle.x = endX;
                    turtle.y = endY;
                }
                ctx.lineTo(endX, endY);
                ctx.stroke();
                return { endX, endY };
            }

            // General case: arc approximated by short line segments
            const angleRad = toRadians(angle);
            const radius = Math.abs(length / angleRad); // Arc length = radius * angle
            const steps = Math.max(10, Math.floor(Math.abs(length) / 5)); // Adjust step count based on length
            const stepLength = length / steps;
            const stepAngle = angleRad / steps;

            ctx.beginPath();
            ctx.moveTo(startX, startY);

            let currentX = startX;
            let currentY = startY;
            let currentHeading = startHeading;

            for (let i = 0; i < steps; i++) {
                // Move forward by stepLength
                const dx = stepLength * Math.cos(currentHeading);
                const dy = stepLength * Math.sin(currentHeading);
                currentX += dx;
                currentY += dy;
                // Turn by stepAngle
                currentHeading += stepAngle;
                // Draw line to new position
                ctx.lineTo(currentX, currentY);
            }

            ctx.stroke();
            if (!isPreview) {
                turtle.x = currentX;
                turtle.y = currentY;
                turtle.heading = currentHeading;
            }
            return { endX: currentX, endY: currentY };
        }

        // Redraw all segments and show cursor
        function redraw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Reset turtle to initial state
            turtle.x = canvas.width / 2;
            turtle.y = canvas.height / 2;
            turtle.heading = 0;

            // Draw all segments up to the editing index
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            let tempTurtle = { x: turtle.x, y: turtle.y, heading: turtle.heading };
            for (let i = 0; i < segments.length; i++) {
                if (editingIndex === i && isDragging) continue; // Skip the segment being edited
                const { endX, endY } = drawArcSegment(segments[i].length, segments[i].angle, false, tempTurtle.x, tempTurtle.y, tempTurtle.heading);
                tempTurtle.x = endX;
                tempTurtle.y = endY;
                tempTurtle.heading = turtle.heading;
            }

            // Draw preview segment if dragging
            if (isDragging && previewSegment) {
                ctx.strokeStyle = 'gray';
                ctx.lineWidth = 1;
                const { endX, endY } = drawArcSegment(previewSegment.length, previewSegment.angle, true, tempTurtle.x, tempTurtle.y, tempTurtle.heading);
                previewEndX = endX;
                previewEndY = endY;
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
            } else {
                previewEndX = tempTurtle.x;
                previewEndY = tempTurtle.y;
            }

            // Draw cursor at the current start position
            ctx.beginPath();
            ctx.arc(tempTurtle.x, tempTurtle.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'red';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Draw endpoint cursor if dragging
            if (isDragging) {
                ctx.beginPath();
                ctx.arc(previewEndX, previewEndY, 5, 0, 2 * Math.PI);
                ctx.fillStyle = 'green';
                ctx.fill();
                ctx.strokeStyle = 'black';
                ctx.stroke();
            }

            // Update the table
            updateSegmentTable();
        }

        // Update the segment table
        function updateSegmentTable() {
            const tbody = document.getElementById('segmentTableBody');
            tbody.innerHTML = '';
            segments.forEach((segment, index) => {
                const row = document.createElement('tr');
                if (index === editingIndex) {
                    row.classList.add('selected');
                }
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><input type="number" value="${segment.length.toFixed(2)}" onchange="updateSegment(${index}, 'length', this.value)"></td>
                    <td><input type="number" value="${segment.angle.toFixed(2)}" onchange="updateSegment(${index}, 'angle', this.value)"></td>
                    <td>
                        <button onclick="editSegment(${index})">Edit</button>
                        <button onclick="insertSegment(${index})">Insert</button>
                        <button onclick="deleteSegment(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Update a segment's value
        function updateSegment(index, field, value) {
            segments[index][field] = parseFloat(value) || 0;
            redraw();
        }

        // Edit a segment using touch/mouse
        function editSegment(index) {
            editingIndex = index;
            redraw();
        }

        // Insert a new segment
        function insertSegment(index) {
            segments.splice(index + 1, 0, { length: 0, angle: 0 });
            redraw();
        }

        // Delete a segment
        function deleteSegment(index) {
            segments.splice(index, 1);
            if (editingIndex === index) {
                editingIndex = -1;
            } else if (editingIndex > index) {
                editingIndex--;
            }
            redraw();
        }

        // Add a new segment
        function addSegment() {
            const length = parseFloat(document.getElementById('length').value) || 0;
            const angle = parseFloat(document.getElementById('angle').value) || 0;
            segments.push({ length, angle });
            redraw();
        }

        // Clear the canvas and reset segments
        function clearCanvas() {
            segments = [];
            editingIndex = -1;
            redraw();
        }

        // Export path data as a text file
        function exportPath() {
            if (segments.length === 0) {
                alert("No segments to export!");
                return;
            }

            // Format segments as "length,angle" (no trailing comma)
            const data = segments.map(segment => `${segment.length},${segment.angle}`).join('\n') + '\n';
            const blob = new Blob([data], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'turtle_path.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Import path data from a text file
        function importPath(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                try {
                    // Parse the text: each line is "length,angle"
                    const lines = text.trim().split('\n');
                    segments = [];
                    let lineNumber = 0;
                    for (const line of lines) {
                        lineNumber++;
                        const parts = line.split(',').map(num => num.trim());
                        if (parts.length !== 2) {
                            throw new Error(`Invalid number of values in line ${lineNumber}: ${line} (expected "length,angle")`);
                        }
                        const length = parseFloat(parts[0]);
                        const angle = parseFloat(parts[1]);
                        if (isNaN(length)) {
                            throw new Error(`Invalid length in line ${lineNumber}: ${parts[0]} is not a number`);
                        }
                        if (isNaN(angle)) {
                            throw new Error(`Invalid angle in line ${lineNumber}: ${parts[1]} is not a number`);
                        }
                        segments.push({ length, angle });
                    }
                    editingIndex = -1;
                    redraw();
                } catch (error) {
                    alert(`Error loading file: ${error.message}`);
                    segments = [];
                    editingIndex = -1;
                    redraw();
                }
            };
            reader.onerror = function() {
                alert("Error reading file!");
            };
            reader.readAsText(file);
        }

        // Touch/Mouse event handlers
        function getRelativePosition(event) {
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (event.type.startsWith('touch')) {
                const touch = event.touches[0] || event.changedTouches[0];
                x = touch.clientX - rect.left;
                y = touch.clientY - rect.top;
            } else {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            return { x, y };
        }

        function startDragging(event) {
            event.preventDefault();
            isDragging = true;
            const pos = getRelativePosition(event);
            dragStartX = pos.x;
            dragStartY = pos.y;

            // Calculate the start position for the segment being added or edited
            turtle.x = canvas.width / 2;
            turtle.y = canvas.height / 2;
            turtle.heading = 0;
            for (let i = 0; i < segments.length; i++) {
                if (editingIndex === i) continue;
                drawArcSegment(segments[i].length, segments[i].angle);
            }

            previewSegment = { length: 0, angle: 0 };
            previewEndX = turtle.x;
            previewEndY = turtle.y;
            redraw();
        }

        function updateDragging(event) {
            if (!isDragging) return;
            event.preventDefault();
            const pos = getRelativePosition(event);
            const dx = pos.x - dragStartX;
            const dy = pos.y - dragStartY;

            // The endpoint position relative to the start point should match the touch position relative to the touch start
            previewEndX = turtle.x + dx;
            previewEndY = turtle.y + dy;

            // Calculate the secant length (distance from start to end)
            const secantLength = Math.sqrt(dx * dx + dy * dy);

            // Calculate the angle between the turtle's heading and the secant
            const secantAngle = Math.atan2(dy, dx);
            const angleRad = secantAngle - turtle.heading;
            const angleDeg = toDegrees(angleRad);

            // The arc's change in heading is twice the angle between the heading and the secant
            let arcAngleDeg = 2 * angleDeg;

            // Normalize the angle to [-360, 360] for touch input
            arcAngleDeg = normalizeAngleForTouch(arcAngleDeg);

            // Calculate the arc length: arcLength = radius * |angleRad|, where radius = secantLength / (2 * sin(|angleRad| / 2))
            const absAngleRad = toRadians(Math.abs(arcAngleDeg));
            let arcLength = 0;
            if (absAngleRad > 0.0001) { // Avoid division by zero
                const radius = secantLength / (2 * Math.sin(absAngleRad / 2));
                arcLength = radius * absAngleRad;
            } else {
                arcLength = secantLength; // For very small angles, approximate as a straight line
            }

            previewSegment = { length: arcLength, angle: arcAngleDeg };
            redraw();
        }

        function stopDragging(event) {
            if (!isDragging) return;
            event.preventDefault();
            isDragging = false;
            if (previewSegment) {
                if (editingIndex >= 0) {
                    // Update the existing segment
                    segments[editingIndex] = previewSegment;
                    editingIndex = -1;
                } else {
                    // Add a new segment
                    segments.push(previewSegment);
                }
                previewSegment = null;
            }
            redraw();
        }

        // Add event listeners for touch and mouse
        canvas.addEventListener('mousedown', startDragging);
        canvas.addEventListener('mousemove', updateDragging);
        canvas.addEventListener('mouseup', stopDragging);
        canvas.addEventListener('touchstart', startDragging);
        canvas.addEventListener('touchmove', updateDragging);
        canvas.addEventListener('touchend', stopDragging);

        // Initial draw
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        redraw();
    </script>
</body>
</html>
