<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cookie Cutter</title>
    <style>
      :root {
        --bg: #12110f;
        --surface: #1c1b18;
        --fg: #ece7dc;
        --muted: #9a9488;
        --primary: #7a9e96;
        --paper: #f3ead8;
        --ink: #2a241c;
        --border: color-mix(in oklab, #ece7dc 12%, transparent);
        --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); }
      button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      #app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100dvh;
      }
      header {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 10px 14px; border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      header h1 { font-size: 1.05rem; font-weight: 600; margin: 0 12px 0 0; letter-spacing: -0.02em; }
      header select, header input, header button {
        background: var(--bg); color: var(--fg); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px; font: inherit; min-height: 40px;
      }
      header button.primary { background: var(--primary); color: #12110f; border-color: transparent; font-weight: 600; }
      .hint { width: 100%; margin: 0; font-size: 12px; color: var(--muted); }
      .stage {
        display: grid; grid-template-columns: 1fr 1fr; min-height: 0;
      }
      @media (max-width: 800px) {
        .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      }
      .panel { position: relative; min-height: 220px; }
      .panel + .panel { border-left: 1px solid var(--border); }
      canvas { width: 100%; height: 100%; display: block; }
      .label {
        position: absolute; top: 10px; left: 10px; z-index: 2;
        font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--muted); pointer-events: none;
      }
      .spin {
        position: absolute; bottom: 10px; left: 10px; z-index: 2;
        background: color-mix(in oklab, var(--bg) 80%, transparent);
        color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 12px; min-height: 40px; font: inherit;
      }
      footer {
        border-top: 1px solid var(--border); background: var(--surface);
        max-height: 34vh; overflow: auto; padding: 8px 12px 16px;
      }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
      th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; }
      td { padding: 2px 6px; }
      td input {
        width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 8px; font: inherit;
      }
      tr.sel td { background: color-mix(in oklab, var(--primary) 18%, transparent); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Cookie Cutter</h1>
        <label>Shape
          <select id="shape"></select>
        </label>
        <label>Scale
          <input id="scale" type="number" min="1" max="40" step="0.5" value="11" />
        </label>
        <button id="fit" type="button">Fit</button>
        <button id="insert" type="button">Insert</button>
        <button id="del" type="button">Delete</button>
        <button id="exportJson" type="button" class="primary">Export JSON</button>
        <p class="hint">Drag a handle to edit · hollow + adds a segment · Delete removes the highlighted row</p>
      </header>
      <div class="stage">
        <div class="panel">
          <div class="label">Path</div>
          <canvas id="edit"></canvas>
        </div>
        <div class="panel">
          <div class="label">3D · Blade</div>
          <canvas id="view"></canvas>
          <button class="spin" id="spin" type="button">Spin</button>
        </div>
      </div>
      <footer>
        <table>
          <thead><tr><th>#</th><th>Length</th><th>Angle (deg)</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </footer>
    </div>
    <script type="module">
      import { CurveEditor } from "./es6/curve-editor.js";
      import { WebGLCutter } from "./es6/webgl-cutter.js";
      import { getOutline, OUTLINE_NAMES } from "./es6/cookiecutters.js";
      import { serializeOutline } from "./es6/path-utils.js";

      const shapeSel = document.getElementById("shape");
      const scaleIn = document.getElementById("scale");
      const delBtn = document.getElementById("del");
      const rows = document.getElementById("rows");
      for (const name of OUTLINE_NAMES.filter((n) => n !== "Blade")) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        shapeSel.appendChild(opt);
      }
      const blank = document.createElement("option");
      blank.value = "Blank";
      blank.textContent = "Blank";
      shapeSel.appendChild(blank);
      shapeSel.value = "Duck";

      let outline = getOutline("Duck");

      const editor = new CurveEditor(document.getElementById("edit"), {
        outline,
        onChange(next) {
          outline = next;
          preview.setOutline(outline, { scale: Number(scaleIn.value) });
          renderTable();
        },
        onSelect() {
          renderTable();
        },
      });
      const preview = new WebGLCutter(document.getElementById("view"), {
        outline,
        outlineScale: 11,
        bladeScale: 5,
        animate: true,
      });

      function load(name) {
        outline =
          name === "Blank"
            ? { name: "Custom", startPoint: [0, 0], startAngle: 0, turtlePath: [] }
            : getOutline(name);
        editor.setOutline(outline, { fit: true, keepSelection: false });
        preview.setOutline(outline, { scale: Number(scaleIn.value) });
        renderTable();
      }

      function renderTable() {
        const selected = editor.getSelected();
        delBtn.disabled = outline.turtlePath.length === 0;
        rows.innerHTML = "";
        outline.turtlePath.forEach(([len, ang], i) => {
          const tr = document.createElement("tr");
          if (i === selected) tr.className = "sel";
          tr.innerHTML = `<td>${i + 1}</td>
            <td><input data-i="${i}" data-f="len" type="number" step="0.01" value="${len}" /></td>
            <td><input data-i="${i}" data-f="ang" type="number" step="0.1" value="${ang}" /></td>`;
          tr.addEventListener("click", (e) => {
            if (e.target.tagName === "INPUT") return;
            editor.setSelected(i);
            renderTable();
          });
          rows.appendChild(tr);
        });
      }

      rows.addEventListener("change", (e) => {
        const t = e.target;
        if (!(t instanceof HTMLInputElement)) return;
        const i = Number(t.dataset.i);
        const f = t.dataset.f;
        const v = Number(t.value);
        const next = outline.turtlePath.map((s) => s.slice());
        next[i][f === "len" ? 0 : 1] = v;
        outline = { ...outline, turtlePath: next };
        editor.setOutline(outline);
        editor.setSelected(i);
        preview.setOutline(outline, { scale: Number(scaleIn.value) });
      });

      shapeSel.addEventListener("change", () => load(shapeSel.value));
      scaleIn.addEventListener("change", () => {
        preview.setOutline(outline, { scale: Number(scaleIn.value) });
      });
      document.getElementById("fit").onclick = () => editor.fit();
      document.getElementById("insert").onclick = () => editor.insertSegment();
      delBtn.onclick = () => editor.deleteSegment();
      document.getElementById("exportJson").onclick = () => {
        const blob = new Blob([serializeOutline(outline)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${outline.name || "cutter"}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
      };
      document.getElementById("spin").onclick = () => preview.setAnimate(true);
      window.addEventListener("keydown", (e) => {
        if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
        if (e.key === "Delete" || e.key === "Backspace") {
          e.preventDefault();
          editor.deleteSegment();
        } else if (e.key === "i" || e.key === "Insert") {
          editor.insertSegment();
        }
      });

      renderTable();
    </script>
  </body>
</html>
