      (function () {
        var ua = navigator.userAgent || "";

        var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
        if (iOS && !safari) document.documentElement.style.setProperty("--preview-top", "52px");
      })();
    </script>
