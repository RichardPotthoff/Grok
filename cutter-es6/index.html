<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" name="viewport"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="Cutter" name="apple-mobile-web-app-title"/>
<meta content="#12110f" name="theme-color"/>
<link href="./manifest.json" rel="manifest"/>
<link href="./icon-180.png" rel="apple-touch-icon"/>
<link href="./favicon.svg" rel="icon" type="image/svg+xml"/>
<title>Cookie Cutter</title>
<style>:root{--bg:#12110f;--surface:#1c1b18;--fg:#ece7dc;--muted:#9a9488;--primary:#7a9e96;--paper:#f3ead8;--ink:#2a241c;--border:color-mix(in oklab,#ece7dc 12%,transparent);--font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;}*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
input,textarea,select{-webkit-user-select:text;user-select:text;}
button:not(:disabled),[role="button"]:not(:disabled){cursor:pointer;}
button:disabled{opacity:0.4;cursor:default;}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh;}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);}
header h1{font-size:1.05rem;font-weight:600;margin:0 12px 0 0;letter-spacing:-0.02em;}
header select,header input,header button{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;min-height:40px;}
header button.primary{background:var(--primary);color:#12110f;border-color:transparent;font-weight:600;}.hint{width:100%;margin:0;font-size:12px;color:var(--muted);}
#sw-status{margin-left:auto;font-size:12px;color:var(--muted);}.stage{display:grid;grid-template-columns:1fr 1fr;min-height:0;}
@media(max-width:800px){.stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}}.panel{position:relative;min-height:220px;}.panel+.panel{border-left:1px solid var(--border);}
canvas{width:100%;height:100%;display:block;}.stage>.panel:first-child.label{left:64px;}.label{position:absolute;top:10px;left:10px;z-index:2;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);pointer-events:none;}.spin{position:absolute;bottom:10px;left:10px;z-index:2;background:color-mix(in oklab,var(--bg) 80%,transparent);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-height:40px;font:inherit;}
footer{border-top:1px solid var(--border);background:var(--surface);max-height:34vh;padding:8px 12px 16px;display:grid;grid-template-columns:minmax(14rem,22rem) 1fr;gap:12px;min-height:0;}
@media(max-width:700px){footer{grid-template-columns:1fr;}}.dock{min-height:0;overflow:auto;}.dock h2{margin:0 0 6px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
#log{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:pre-wrap;}
#log.row{padding:2px 0;border-bottom:1px solid var(--border);}
#log.row.undo{color:#c4a574;}
#log.row.reject{color:#c47a6a;}
#log.row.edit{color:var(--fg);}
#log.row.live{color:#7a9e96;}
#log.row.err{color:#e07070;}
#log.row.warn{color:#c4a574;}
#updateApp{display:none;}
#updateApp.show{display:inline-block;background:var(--primary);color:#12110f;border-color:transparent;font-weight:600;}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;}
td{padding:2px 6px;}
td input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:inherit;}
tr.sel td{background:color-mix(in oklab,var(--primary) 18%,transparent);}
</style>
</head>
<body>
<div id="app">
<header>
<h1>Cookie Cutter</h1>
<label>Shape
          <select id="shape"></select>
</label>
<label>Scale
          <input id="scale" max="40" min="1" step="0.5" type="number" value="11"/>
</label>
<button class="primary" id="exportJson" type="button">Export JSON</button>
<button id="undo" type="button">Undo</button>
<button id="kit" type="button">Download kit</button>
<button id="updateApp" type="button">Update app</button>
<span id="sw-status"></span>
<p class="hint">Update app reloads a new GitHub Pages build. Log last line tracks the live drag. Plain split to 4 arcs: Move/Tan now pick the short sqrt branch.</p>
</header>
<div class="stage">
<div class="panel">
<div class="label">Path</div>
<canvas id="edit"></canvas>
</div>
<div class="panel">
<div class="label">3D · Blade</div>
<canvas id="view"></canvas>
<button class="spin" id="spin" type="button">Spin</button>
</div>
</div>
<footer>
<div class="dock">
<h2>Arcs</h2>
<table>
<thead><tr><th>#</th><th>Length</th><th>Angle (deg)</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<div class="dock">
<h2>Log</h2>
<div id="log"></div>
</div>
</footer>
</div>
