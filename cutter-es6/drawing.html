<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arc Draw" />
    <meta name="theme-color" content="#12110f" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Arc Drawing</title>
    <style>
      :root {
        --bg: #12110f;
        --surface: #1c1b18;
        --fg: #ece7dc;
        --muted: #9a9488;
        --primary: #7a9e96;
        --paper: #f3ead8;
        --ink: #2a241c;
        --border: color-mix(in oklab, #ece7dc 12%, transparent);
        --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font);
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
      input, textarea, select, #log, #log *, #tape {
        -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
      }
      button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      #app {
        height: 100%;
        height: 100dvh;
        display: grid;
        grid-template-rows: auto minmax(10rem, 1fr) minmax(2.75rem, auto) minmax(5rem, 28vh);
        min-height: 0;
        overflow: hidden;
      }
      header {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 10px 14px; border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      header h1 { font-size: 1.05rem; font-weight: 600; margin: 0 10px 0 0; letter-spacing: -0.02em; }
      header select, header input, header button, header a.btn {
        background: var(--bg); color: var(--fg); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px; font: inherit; min-height: 40px;
        text-decoration: none; display: inline-flex; align-items: center;
      }
      header button.primary { background: var(--primary); color: #12110f; border-color: transparent; font-weight: 600; }
      header input[type="text"] { min-width: 10rem; }
      .hint { width: 100%; margin: 0; font-size: 12px; color: var(--muted); }
      .stage {
        display: grid; grid-template-columns: 1fr minmax(11rem, 16rem); min-height: 0;
      }
      @media (max-width: 800px) {
        .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 38vh; }
      }
      .panel { position: relative; min-height: 180px; }
      .gallery-panel {
        border-left: 1px solid var(--border);
        background: var(--surface);
        display: flex; flex-direction: column; min-height: 0;
      }
      canvas { width: 100%; height: 100%; display: block; }
      .label {
        position: absolute; top: 10px; left: 64px; z-index: 2;
        font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--muted); pointer-events: none;
      }
      .gallery-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 10px; border-bottom: 1px solid var(--border);
        font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      }
      .gallery-head button { min-height: 32px; padding: 4px 8px; }
      #gallery {
        flex: 1; overflow: auto; padding: 8px;
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start;
      }
      .thumb {
        background: var(--paper); color: var(--ink); border: 1px solid var(--border);
        border-radius: 8px; padding: 6px; min-height: 88px;
        display: flex; flex-direction: column; gap: 4px;
      }
      .thumb.on { outline: 2px solid var(--primary); }
      .thumb svg { width: 100%; height: 64px; display: block; }
      .thumb .nm { font-size: 11px; color: var(--ink); text-align: center; font-weight: 600; }
      #tape-strip {
        border-top: 1px solid var(--border); background: var(--surface);
        padding: 8px 12px 10px;
        min-height: 0; max-height: 32vh;
        display: flex; flex-direction: column; overflow: hidden;
      }
      .tape-head {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        margin-bottom: 6px; font-size: 11px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--muted); font-weight: 600;
        flex: 0 0 auto;
      }
      .tape-head button {
        background: var(--bg); color: var(--fg); border: 1px solid var(--border);
        border-radius: 8px; padding: 6px 10px; font: inherit; min-height: 32px;
        text-transform: none; letter-spacing: 0;
      }
      #tape {
        width: 100%; min-height: 0; flex: 1 1 auto; resize: none;
        background: var(--bg); color: var(--fg); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        touch-action: auto;
      }
      #tape-strip.collapsed { max-height: none; }
      #tape-strip.collapsed #tape { display: none; }
      footer {
        border-top: 1px solid var(--border); background: var(--surface);
        max-height: none; padding: 8px 12px 16px;
        display: grid; grid-template-columns: minmax(22rem, 1.4fr) minmax(9rem, 12rem) minmax(8rem, 1fr);
        gap: 12px; min-height: 0; overflow: auto;
      }
      @media (max-width: 800px) {
        footer { grid-template-columns: 1fr; }
      }
      @media (max-height: 640px) {
        #app { grid-template-rows: auto minmax(8rem, 1fr) minmax(2.75rem, auto) minmax(4.5rem, 26vh); }
        #tape-strip { max-height: 26vh; }
      }
      .dock { min-height: 0; overflow: auto; }
      .dock h2 {
        margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--muted); font-weight: 600;
      }
      #log {
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted); white-space: pre-wrap;
        overflow: auto; max-height: 26vh; min-height: 4rem;
      }
      #log .row { padding: 2px 0; border-bottom: 1px solid var(--border); }
      #log .row.undo { color: #c4a574; }
      #log .row.reject { color: #c47a6a; }
      #log .row.edit { color: var(--fg); }
      #log .row.live { color: #7a9e96; }
      #log .row.err { color: #e07070; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
      th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 4px; white-space: nowrap; }
      td { padding: 1px 4px; }
      td.kind { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
      td input {
        width: 100%; min-width: 3.2rem; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
        border-radius: 6px; padding: 5px 6px; font: inherit;
      }
      tr.sel td { background: color-mix(in oklab, var(--primary) 18%, transparent); }
      tr.span td { background: color-mix(in oklab, var(--primary) 8%, transparent); }
      tr.span.sel td { background: color-mix(in oklab, var(--primary) 22%, transparent); }
      tr.vtx td { font-variant-numeric: tabular-nums; }
      td input:disabled { opacity: 0.4; }
      #strokes { display: flex; flex-direction: column; gap: 4px; }
      .stroke-row {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border);
        background: var(--bg); min-height: 36px;
      }
      .stroke-row.on { outline: 2px solid var(--primary); }
      .swatch { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); flex: 0 0 auto; }
      .stroke-row span { flex: 1; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Arc Drawing</h1>
        <input id="docName" type="text" value="Untitled" aria-label="Drawing name" />
        <button id="newDoc" type="button">New</button>
        <button id="addStroke" type="button">Add stroke</button>
        <button id="resetIcon" type="button">Reset icon</button>
        <button id="copySvg" type="button" class="primary">Copy SVG</button>
        <button id="copyJson" type="button">Copy JSON</button>
        <button id="undo" type="button">Undo</button>
        <a class="btn" href="./standalone.html">Cutter</a>
        <p class="hint">Path picks a whole stroke; Select only picks an arc on the current path. Tape is a stack language — Run the Pan example to see AH + TL.</p>
      </header>
      <div class="stage">
        <div class="panel">
          <div class="label">Path</div>
          <canvas id="edit"></canvas>
        </div>
        <div class="gallery-panel">
          <div class="gallery-head">
            <span>Gallery</span>
            <button id="newFromBlank" type="button">+ Page</button>
          </div>
          <div id="gallery"></div>
        </div>
      </div>
      <div id="tape-strip">
        <div class="tape-head">
          <span>Tape</span>
          <button id="tapeRun" type="button">Run</button>
          <button id="tapePan" type="button">Pan example</button>
          <button id="tapeWords" type="button">Words</button>
          <button id="tapeCopy" type="button">Copy tape</button>
          <button id="tapeFold" type="button" title="Hide or show the tape text">Fold</button>
        </div>
        <textarea id="tape" spellcheck="false" aria-label="Command tape"></textarea>
      </div>
      <footer>
        <div class="dock">
          <h2>Path</h2>
          <table>
            <thead><tr><th></th><th></th><th>s / x</th><th>Δθ / y</th><th>R / θ</th><th>κ</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="dock">
          <h2>Strokes</h2>
          <div style="display:flex;gap:6px;margin-bottom:6px">
            <label style="font-size:11px;color:var(--muted)">Stroke
              <select id="strokeRole">
                <option value="ink">ink</option>
                <option value="accent">accent</option>
                <option value="muted">muted</option>
                <option value="danger">danger</option>
              </select>
            </label>
            <label style="font-size:11px;color:var(--muted)">Fill
              <select id="fillRole">
                <option value="">none</option>
                <option value="ink">ink</option>
                <option value="accent">accent</option>
                <option value="paper">paper</option>
              </select>
            </label>
          </div>
          <div id="strokes"></div>
        </div>
        <div class="dock">
          <h2>Log</h2>
          <div id="log"></div>
        </div>
      </footer>
    </div>
    <script type="module">
      import { CurveEditor } from "./es6/curve-editor.js";
      import { getOutline } from "./es6/cookiecutters.js";
      import {
        blankDrawing,
        blankStroke,
        cloneDrawing,
        normalizeDrawing,
        serializeDrawing,
        parseDrawing,
        outlineFromStroke,
        strokeFromOutline,
        withActiveStroke,
        activeStroke,
      } from "./es6/drawing-doc.js";
      import { TOOL_ICONS, iconDrawing, drawingToSvg } from "./es6/tool-icons.js";
      import { TurtleStack, TAPE_HELP, TAPE_PAN } from "./es6/turtle-cmd.js";
      import { walkExact } from "./es6/close-path.js";
      import { applyVertexStable, recoverP, quadIdx } from "./es6/biarc.js";

      const STORE = "arc-drawing-app-v3";
      const nameIn = document.getElementById("docName");
      const rows = document.getElementById("rows");
      const galleryEl = document.getElementById("gallery");
      const strokesEl = document.getElementById("strokes");
      const logEl = document.getElementById("log");

      function seedLibrary() {
        const duck = strokeFromOutline(getOutline("Duck"), { stroke: "ink", width: 1.8 });
        return [
          ...TOOL_ICONS.map((d) => cloneDrawing(d)),
          normalizeDrawing({ name: "Duck", id: "sample-duck", paths: [duck] }),
          blankDrawing("Blank"),
        ];
      }

      function loadStore() {
        try {
          const raw = localStorage.getItem(STORE);
          if (!raw) return null;
          const data = JSON.parse(raw);
          if (!Array.isArray(data.library) || !data.library.length) return null;
          return {
            library: data.library.map(normalizeDrawing),
            index: Math.max(0, Math.min(data.index || 0, data.library.length - 1)),
          };
        } catch {
          return null;
        }
      }

      const saved = loadStore();
      let library = saved ? saved.library : seedLibrary();
      let index = saved ? saved.index : 0;
      let drawing = cloneDrawing(library[index]);

      function persist() {
        library[index] = cloneDrawing(drawing);
        try {
          localStorage.setItem(STORE, JSON.stringify({ index, library }));
        } catch (_) {}
      }

      function escapeLog(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function renderLog(list) {
        if (!logEl) return;
        const tail = (list || []).slice(-80);
        logEl.innerHTML = tail
          .map((r) => `<div class="row ${escapeLog(r.kind)}">${escapeLog(r.kind)} · ${escapeLog(r.summary || "")}</div>`)
          .join("");
        logEl.scrollTop = logEl.scrollHeight;
      }

      function currentStroke() {
        return activeStroke(drawing);
      }

      function otherStrokes() {
        return drawing.paths.filter((_, i) => i !== drawing.active);
      }

      function pagePathList() {
        return drawing.paths.map((s) => ({ id: s.id, outline: outlineFromStroke(s) }));
      }

      function pushStrokeToEditor({ fit = false, commit = false } = {}) {
        const s = currentStroke();
        editor.setBackdrop(otherStrokes().map(outlineFromStroke));
        editor.setPagePaths(pagePathList());
        editor.setOutline(outlineFromStroke(s), { fit, keepSelection: false, commit });
      }

      function pickPathById(id) {
        const i = drawing.paths.findIndex((s) => s.id === id);
        if (i < 0 || i === drawing.active) return;
        drawing.active = i;
        pushStrokeToEditor({ fit: false });
        persist();
        renderAll();
        editor.noteFromHost?.("edit", `path ${id}`);
      }

      const editor = new CurveEditor(document.getElementById("edit"), {
        outline: outlineFromStroke(currentStroke()),
        backdrop: otherStrokes().map(outlineFromStroke),
        pagePaths: drawing.paths.map((s) => ({ id: s.id, outline: outlineFromStroke(s) })),
        onPickPath: (id) => pickPathById(id),
        onChange(next) {
          const prev = currentStroke();
          drawing = withActiveStroke(drawing, {
            ...next,
            id: prev.id,
            stroke: prev.stroke,
            width: prev.width,
            fill: prev.fill,
            name: prev.name,
          });
          persist();
          renderTable();
          renderGallery();
          renderStrokes();
        },
        onSelect() {
          renderTable({ scroll: true });
        },
        onTool() {
          renderTable({ scroll: true });
        },
        onLog: renderLog,
      });
      renderLog(editor.getLog());

      nameIn.value = drawing.name || "";
      nameIn.addEventListener("change", () => {
        drawing.name = nameIn.value.trim() || "Untitled";
        persist();
        renderGallery();
      });

      function selectDoc(i, { fit = true } = {}) {
        persist();
        index = i;
        drawing = cloneDrawing(library[index]);
        nameIn.value = drawing.name || "";
        pushStrokeToEditor({ fit, commit: "load" });
        persist();
        renderAll();
      }

      function renderGallery() {
        galleryEl.innerHTML = "";
        library.forEach((doc, i) => {
          const shown = i === index ? drawing : doc;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "thumb" + (i === index ? " on" : "");
          btn.innerHTML = `${drawingToSvg(shown, { size: 96, theme: "light", pad: 3 })}<span class="nm">${escapeLog(shown.name)}</span>`;
          btn.addEventListener("click", () => selectDoc(i));
          galleryEl.appendChild(btn);
        });
      }

      function renderStrokes() {
        const strokeRole = document.getElementById("strokeRole");
        const fillRole = document.getElementById("fillRole");
        const cur = currentStroke();
        if (strokeRole) strokeRole.value = cur.stroke || "ink";
        if (fillRole) fillRole.value = cur.fill || "";
        strokesEl.innerHTML = "";
        drawing.paths.forEach((s, i) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "stroke-row" + (i === drawing.active ? " on" : "");
          const color =
            s.stroke === "accent" ? "#7a9e96" : s.stroke === "danger" ? "#e07070" : s.stroke === "muted" ? "#9a9488" : "#ece7dc";
          row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${s.id || i + 1} · ${s.name || s.stroke} · ${s.turtlePath.length} arcs</span>`;
          row.addEventListener("click", () => {
            drawing.active = i;
            pushStrokeToEditor({ fit: true });
            persist();
            renderAll();
          });
          strokesEl.appendChild(row);
        });
      }

      const DEG = Math.PI / 180;
      function fmtCell(n, d) {
        if (!Number.isFinite(n)) return "";
        const v = Number(n);
        if (Math.abs(v) >= 1e5) return "";
        return v.toFixed(d);
      }
      function radiusOf(s, daDeg) {
        const a = daDeg * DEG;
        if (Math.abs(a) < 1e-10) return Infinity;
        return s / a;
      }
      function kappaOf(s, daDeg) {
        if (Math.abs(s) < 1e-10) return 0;
        return (daDeg * DEG) / s;
      }
      function vertexRole(j, n, tool, joint) {
        const mid = joint === n ? 0 : joint;
        if (j === 0) return "start";
        if (j === n) return "end";
        if ((tool === "move" || tool === "tan") && j === mid) return "vertex";
        if ((tool === "p" || tool === "locus") && j === mid) return "junction";
        return "joint";
      }
      function arcRole(i, tool, span) {
        if (span.has(i) && (tool === "move" || tool === "tan")) return "dual";
        if (span.has(i) && (tool === "p" || tool === "locus")) return "biarc";
        return "arc";
      }
      function canEdit(tool, kind, field, { inSpan, focusVtx }) {
        if (tool === "pan" || tool === "path" || tool === "fit") return false;
        if (kind === "arc") {
          if (!inSpan) return false;
          if (tool === "move" || tool === "tan" || tool === "p" || tool === "locus") return false;
          return field === "s" || field === "da" || field === "R" || field === "k";
        }
        if (!focusVtx) return false;
        if (tool === "move") return field === "x" || field === "y";
        if (tool === "tan") return field === "th";
        if (tool === "select" && kind === "vtx" && field === "th") return false;
        return false;
      }
      function inputCell(opts) {
        const { enabled, value, digits, step, data } = opts;
        const shown = fmtCell(value, digits);
        const dis = enabled ? "" : " disabled";
        const attrs = Object.entries(data).map(([k, v]) => `data-${k}="${v}"`).join(" ");
        return `<input ${attrs} type="number" step="${step}" value="${shown}"${dis} />`;
      }

      function renderTable({ scroll = false } = {}) {
        const selected = editor.getSelected();
        const span = new Set(editor.span?.() || (selected >= 0 ? [selected] : []));
        const stroke = currentStroke();
        const path = stroke.turtlePath;
        const n = path.length;
        const tool = editor.getTool?.() || "select";
        const joint = editor.joint ?? (selected >= 0 ? selected + 1 : 0);
        const mid = joint === n ? 0 : joint;
        const poses = walkExact(outlineFromStroke(stroke));
        rows.innerHTML = "";
        for (let j = 0; j <= n; j++) {
          const pose = poses[j] || { point: [0, 0], heading: 0 };
          const θ = pose.heading / DEG;
          const inSpanV = (j > 0 && span.has(j - 1)) || (j < n && span.has(j));
          const focusVtx = inSpanV && j === mid && (tool === "move" || tool === "tan");
          const trv = document.createElement("tr");
          trv.className = ["vtx", inSpanV ? "span" : "", focusVtx ? "sel" : ""].filter(Boolean).join(" ");
          const role = vertexRole(j, n, tool, joint);
          trv.innerHTML = `<td>v${j}</td><td class="kind">${role}</td>
            <td>${inputCell({ enabled: canEdit(tool, "vtx", "x", { inSpan: inSpanV, focusVtx }), value: pose.point[0], digits: 3, step: 0.01, data: { kind: "vtx", j, f: "x" } })}</td>
            <td>${inputCell({ enabled: canEdit(tool, "vtx", "y", { inSpan: inSpanV, focusVtx }), value: pose.point[1], digits: 3, step: 0.01, data: { kind: "vtx", j, f: "y" } })}</td>
            <td>${inputCell({ enabled: canEdit(tool, "vtx", "th", { inSpan: inSpanV, focusVtx }), value: θ, digits: 2, step: 0.1, data: { kind: "vtx", j, f: "th" } })}</td>
            <td></td>`;
          trv.addEventListener("click", (e) => {
            if (e.target.tagName === "INPUT") return;
            if (j < n) editor.setSelected(j);
            else if (n) editor.setSelected(n - 1);
            renderTable({ scroll: true });
          });
          rows.appendChild(trv);
          if (j === n) break;
          const [s, da] = path[j];
          const inSpan = span.has(j);
          const tra = document.createElement("tr");
          tra.className = ["arc", inSpan ? "span" : "", j === selected ? "sel" : ""].filter(Boolean).join(" ");
          const R = radiusOf(s, da);
          const k = kappaOf(s, da);
          const ae = (field) => canEdit(tool, "arc", field, { inSpan, focusVtx: false });
          tra.innerHTML = `<td>a${j + 1}</td><td class="kind">${arcRole(j, tool, span)}</td>
            <td>${inputCell({ enabled: ae("s"), value: s, digits: 3, step: 0.01, data: { kind: "arc", i: j, f: "s" } })}</td>
            <td>${inputCell({ enabled: ae("da"), value: da, digits: 2, step: 0.1, data: { kind: "arc", i: j, f: "da" } })}</td>
            <td>${inputCell({ enabled: ae("R") && Number.isFinite(R), value: R, digits: 3, step: 0.01, data: { kind: "arc", i: j, f: "R" } })}</td>
            <td>${inputCell({ enabled: ae("k"), value: k, digits: 4, step: 0.001, data: { kind: "arc", i: j, f: "k" } })}</td>`;
          tra.addEventListener("click", (e) => {
            if (e.target.tagName === "INPUT") return;
            editor.setSelected(j);
            renderTable({ scroll: true });
          });
          rows.appendChild(tra);
        }
        if (scroll) {
          const hit = rows.querySelector("tr.sel") || rows.querySelector("tr.span");
          hit?.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      }

      function renderAll() {
        renderTable();
        renderGallery();
        renderStrokes();
      }

      rows.addEventListener("change", (e) => {
        const t = e.target;
        if (!(t instanceof HTMLInputElement)) return;
        const v = Number(t.value);
        if (!Number.isFinite(v)) return;
        const kind = t.dataset.kind;
        const outline = outlineFromStroke(currentStroke());
        const tool = editor.getTool?.() || "select";

        if (kind === "arc") {
          const i = Number(t.dataset.i);
          const f = t.dataset.f;
          const next = outline.turtlePath.map((s) => s.slice());
          let [s, da] = next[i];
          if (f === "s") s = v;
          else if (f === "da") da = v;
          else if (f === "R") s = v * da * DEG;
          else if (f === "k") da = (v * s) / DEG;
          next[i] = [s, da];
          drawing = withActiveStroke(drawing, { turtlePath: next });
          editor.setOutline(outlineFromStroke(currentStroke()), { commit: "table" });
          editor.setSelected(i);
        } else if (kind === "vtx" && (tool === "move" || tool === "tan")) {
          const j = Number(t.dataset.j);
          const n = outline.turtlePath.length;
          const joint = editor.joint ?? j;
          const mid = joint === n ? 0 : joint;
          if (j !== mid) return;
          const poses = walkExact(outline);
          const pose = poses[j];
          let P = pose.point.slice();
          let θ = pose.heading;
          if (t.dataset.f === "x") P[0] = v;
          if (t.dataset.f === "y") P[1] = v;
          if (t.dataset.f === "th") θ = v * DEG;
          const q = quadIdx(joint, n);
          const pL = q ? recoverP(outline, q[1], editor._pL) : 1;
          const pR = q ? recoverP(outline, q[3], editor._pR) : 1;
          const next = applyVertexStable(outline, joint, P, θ, pL, pR);
          if (next && next !== outline) {
            drawing = withActiveStroke(drawing, next);
            editor.setOutline(outlineFromStroke(currentStroke()), { commit: "table" });
          }
        }
        persist();
        renderAll();
      });

      document.getElementById("newDoc").onclick = () => {
        library.push(blankDrawing("Untitled"));
        selectDoc(library.length - 1);
      };
      document.getElementById("newFromBlank").onclick = () => {
        library.push(blankDrawing("Page " + (library.length + 1)));
        selectDoc(library.length - 1);
      };
      document.getElementById("addStroke").onclick = () => {
        drawing.paths.push(blankStroke("stroke " + (drawing.paths.length + 1)));
        drawing.active = drawing.paths.length - 1;
        pushStrokeToEditor({ fit: true });
        persist();
        renderAll();
      };
      document.getElementById("resetIcon").onclick = () => {
        const id = drawing.id;
        const fresh = id ? iconDrawing(id) : null;
        if (!fresh) {
          editor.noteFromHost?.("warn", "Not a catalog icon — nothing to reset");
          return;
        }
        drawing = fresh;
        nameIn.value = drawing.name;
        pushStrokeToEditor({ fit: true, commit: "load" });
        persist();
        renderAll();
      };

      async function copyText(text, okMsg) {
        try {
          await navigator.clipboard.writeText(text);
          editor.noteFromHost?.("edit", okMsg);
        } catch (err) {
          editor.noteFromHost?.("err", err.message || String(err));
        }
      }
      document.getElementById("copySvg").onclick = () => {
        copyText(drawingToSvg(drawing, { size: 256, theme: "light", pad: 3 }), "copied SVG");
      };
      document.getElementById("copyJson").onclick = () => {
        copyText(serializeDrawing(drawing), "copied JSON");
      };
      document.getElementById("undo").onclick = () => editor.undo();
      document.getElementById("strokeRole")?.addEventListener("change", (e) => {
        drawing = withActiveStroke(drawing, { stroke: e.target.value });
        persist();
        renderAll();
      });
      document.getElementById("fillRole")?.addEventListener("change", (e) => {
        drawing = withActiveStroke(drawing, { fill: e.target.value || null });
        persist();
        renderAll();
      });

      window.addEventListener("keydown", (e) => {
        if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.target instanceof HTMLTextAreaElement) return;
        if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          editor.undo();
        } else if (e.key === "Delete" || e.key === "Backspace") {
          e.preventDefault();
          editor.deleteSegment();
        }
      });

      const origErr = console.error.bind(console);
      console.error = (...args) => {
        origErr(...args);
        editor?.noteFromHost?.("err", args.map(String).join(" "));
      };
      window.addEventListener("error", (e) => {
        editor?.noteFromHost?.("err", e.message || String(e.error || e));
      });

      const tapeEl = document.getElementById("tape");
      tapeEl.value = TAPE_HELP + "\n" + TAPE_PAN + "\n";

      function applyEmitted(path) {
        drawing = withActiveStroke(drawing, {
          ...path,
          id: currentStroke().id,
          name: currentStroke().name || path.name,
        });
        pushStrokeToEditor({ fit: true, commit: "tape" });
        persist();
        renderAll();
      }

      function runTape(src) {
        try {
          const st = new TurtleStack({
            onEmit: applyEmitted,
            onLog: (msg) => editor.noteFromHost?.("edit", msg),
          });
          st.eval(src);
          if (!/\bemit\b/i.test(src) && st.stack.length) {
            const top = st.peek();
            if (top && top.turtlePath) applyEmitted(top);
          }
          editor.noteFromHost?.("edit", "tape · stack " + st.dump().join(" "));
        } catch (err) {
          editor.noteFromHost?.("err", err.message || String(err));
        }
      }

      document.getElementById("tapeRun").onclick = () => runTape(tapeEl.value);
      document.getElementById("tapePan").onclick = () => {
        tapeEl.value = TAPE_HELP + "\n" + TAPE_PAN + "\n";
      };
      document.getElementById("tapeWords").onclick = () => runTape("words");
      document.getElementById("tapeCopy").onclick = () => {
        navigator.clipboard.writeText(tapeEl.value).then(
          () => editor.noteFromHost?.("edit", "copied tape"),
          (err) => editor.noteFromHost?.("err", err.message || String(err)),
        );
      };
      document.getElementById("tapeFold").onclick = () => {
        document.getElementById("tape-strip").classList.toggle("collapsed");
      };

      editor.fit();
      renderAll();
    </script>
  </body>
</html>
