# Build & deploy the drawing_anyui bundle to GitHub Pages
# Triggers: manual run (workflow_dispatch) and pushes to main.
name: Build & deploy drawing_anyui bundle to Pages

on:
  workflow_dispatch: {}        # lets you run it from the Actions UI
  push:
    branches: [ main ]         # change if your default branch is different

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run bundler
        run: |
          # run your script (it writes index_drawing_anyui.html by default)
          python cutter-es6/es6_iife_drawing_anyui.py

      - name: Upload build as workflow artifact (optional inspection)
        uses: actions/upload-artifact@v4
        with:
          name: drawing_anyui-build
          path: .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5