# Build & deploy the drawing_anyui bundle to GitHub Pages
# Triggers: manual run (workflow_dispatch) and pushes to main.
name: Build & deploy drawing_anyui bundle to Pages

on:
  workflow_dispatch: {}        # lets you run it from the Actions UI
  push:
    branches: [ main ]         # change if your default branch is different

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run bundler
        run: |
          # run your script (it writes index_drawing_anyui.html by default)
          python cutter-es6/es6_iife_drawing_anyui.py

      - name: Prepare site folder for Pages
        run: |
          mkdir -p docs/cutter-es6
          if [ -f index_drawing_anyui.html ]; then
            mv index_drawing_anyui.html docs/cutter-es6/index_drawing_anyui.html
          else
            echo "Bundled file not found" && exit 1
          fi
          # copy sw/manifest if present in repo so they are deployed next to the html
          if [ -f cutter-es6/sw.js ]; then cp cutter-es6/sw.js docs/cutter-es6/sw.js; fi
          if [ -f cutter-es6/manifest.json ]; then cp cutter-es6/manifest.json docs/cutter-es6/manifest.json; fi

      - name: Upload build as workflow artifact (optional inspection)
        uses: actions/upload-artifact@v4
        with:
          name: drawing_anyui-build
          path: ./docs

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1